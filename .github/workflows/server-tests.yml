name: Server tests

on:
  pull_request:
    paths:
      - "ansible/server.yml"
      - "ansible/roles/server_*/**"
      - "bootstrap/**"
      - "tests/container/*server*"
      - "tests/gates/server-services.sh"
      - ".github/workflows/server-tests.yml"
  push:
    branches: [main]
    paths:
      - "ansible/server.yml"
      - "ansible/roles/server_*/**"
      - "bootstrap/**"

permissions:
  contents: read

jobs:
  container:
    name: Server playbook in Ubuntu
    # Pinned: ubuntu-latest moved to 26.04 ("resolute"), whose runners
    # could not resolve ubuntu.com on 2026-11-11 (apt hung for hours).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/container/run-server.sh
        run: tests/container/run-server.sh
