name: Launcher

on:
  pull_request:
    paths:
      - "launcher/**"
      - "games/**"
      - ".github/workflows/launcher.yml"
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - "games/**"

jobs:
  check:
    name: Launcher and game manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - run: launcher/scripts/check.sh
