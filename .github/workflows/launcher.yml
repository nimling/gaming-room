name: Launcher

on:
  pull_request:
    paths:
      - "launcher/**"
      - "games/**"
      - ".github/workflows/launcher.yml"
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - "games/**"

jobs:
  check:
    name: Launcher and game manifests
    # Pinned: ubuntu-latest moved to 26.04 ("resolute"), whose runners
    # could not resolve ubuntu.com on 2026-11-11 (apt hung for hours).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - run: launcher/scripts/check.sh
