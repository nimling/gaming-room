name: Seat tests

on:
  pull_request:
    paths:
      - "ansible/**"
      - "tests/**"
      - ".github/workflows/seat-tests.yml"
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  container:
    name: Playbook and Phase 1 gates in CachyOS
    # Pinned: ubuntu-latest moved to 26.04 ("resolute"), whose runners
    # could not resolve ubuntu.com on 2026-11-11 (apt hung for hours).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/container/run.sh
        run: tests/container/run.sh
