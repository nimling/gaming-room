name: Seat tests

on:
  pull_request:
    paths:
      - "ansible/**"
      - "tests/**"
      - ".github/workflows/seat-tests.yml"
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  container:
    name: Playbook and Phase 1 gates in CachyOS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/container/run.sh
        run: tests/container/run.sh
