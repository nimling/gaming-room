# Unreal Tournament (GOTY) on OldUnreal 469e, native Linux.
# The server builds the game (roles/server_gameshare); each seat copies it
# read-only to /games/classic/ut99 (roles/games). The golden home starts with
# the game's own default settings (roles/launcher), and the keys below go on
# top at every start.
id: ut99
name: Unreal Tournament
subtitle: Deathmatch, CTF, Assault, Domination
group: classic
runtime: native
engine: OldUnreal 469e
# Shown in the launcher's game details view.
why: >-
  The LAN party classic. A match starts in seconds, and InstaGib (one shot,
  one frag) makes new players and veterans equal from the first round.
highlights:
  - Host an InstaGib match from the launcher
  - Drop in and out of a match any time
  - Up to 16 players
path: /games/classic/ut99
players: { min: 2, max: 16 }
launch:
  workdir: System64
  command: ["./ut-bin"]
# Address, or address:port; servers listen on 7777 by default.
join:
  args: ["{{ server }}"]
# InstaGib is built in: one shot, one frag.
host:
  map: DM-Deck16][
  args: ["{{ map }}?Listen?game=Botpack.DeathMatchPlus?mutator=Botpack.InstaGibDM"]
config:
  - ini: "~/.utpg/System/User.ini"
    set:
      DefaultPlayer:
        Name: "{{ nickname }}"
  - ini: "~/.utpg/System/UnrealTournament.ini"
    set:
      # No first-start setup screen.
      FirstRun:
        FirstRun: "469"
      # Skip the intro flyby; start in the quiet menu map.
      URL:
        LocalMap: UT-Logo-Map.unr
      SDLDrv.SDLClient:
        StartupFullscreen: "True"
        FullscreenViewportX: "{{ width }}"
        FullscreenViewportY: "{{ height }}"
      OpenGLDrv.OpenGLRenderDevice:
        FrameRateLimit: "{{ fps_cap }}"
profiles:
  A: { resolution: native, fps_cap: refresh }
  B: { resolution: native, fps_cap: 144 }
  C: { resolution: 1920x1080, fps_cap: 144 }
art: { hue: 252, glow: 18, motif: rings }
