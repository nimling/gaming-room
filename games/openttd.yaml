# OpenTTD: free transport tycoon, co-op or competitive, native. CachyOS
# packages openttd, openttd-opengfx and openttd-opensfx (free base sets, so
# no download dialog). Settings live in ~/.config/openttd; the game fills in
# its own defaults around the keys below.
# To check on the canary: no survey question, the nickname, fullscreen.
id: openttd
name: OpenTTD
subtitle: Build a transport empire, together or against each other
group: classic
runtime: native
engine: OpenTTD 15
# Shown in the launcher's game details view.
why: >-
  A calm game for the whole evening. Build a railway empire together in one
  company, or compete for the best routes. People can join a running game at
  any time.
highlights:
  - Co-op or competitive, up to 16 players
  - Join a running game any time
  - Free and light on every seat
players: { min: 1, max: 16 }
launch:
  command: ["openttd"]
config:
  - ini: "~/.config/openttd/openttd.cfg"
    set:
      misc:
        fullscreen: "true"
        resolution: "{{ width }},{{ height }}"
  # Player name and the first-start survey question live in private.cfg.
  - ini: "~/.config/openttd/private.cfg"
    set:
      network:
        client_name: "{{ nickname }}"
        participate_survey: "no"
# Address, or address:port; servers listen on 3979 by default.
join:
  args: ["-n", "{{ server }}"]
profiles:
  A: { resolution: native, fps_cap: refresh }
  B: { resolution: native, fps_cap: 144 }
  C: { resolution: native, fps_cap: 60 }
art: { hue: 122, glow: 64, motif: grid }
