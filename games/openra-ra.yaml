# Red Alert on the OpenRA engine (native, free). Installed as the CachyOS
# openra package, so there is no path. The game content (EA freeware) is
# fetched into /games/openra by the games role. Tested on seat-01: straight
# to the main menu, no dialogs.
id: openra-ra
name: Red Alert
subtitle: Allies against Soviets, on OpenRA
group: classic
runtime: native
engine: OpenRA
# Shown in the launcher's game details view.
why: >-
  The real-time strategy game many of us grew up with, on a modern engine. Two
  against two, or the whole room against the computer, makes a perfect
  half-hour break from shooters.
highlights:
  - Team games or co-op against the computer
  - Up to 8 players
  - Free, with no account or licence needed
players: { min: 1, max: 8 }
launch:
  command: ["openra-ra"]
# OpenRA asks two first-start questions (introduction, system information)
# unless its settings say they were answered. Versions from OpenRA's source
# for release-20250330: IntroductionVersion 1, SystemInformationVersion 6.
config:
  - template: openra-ra/settings.yaml.j2
    to: "~/.config/openra/settings.yaml"
join:
  args: ["Launch.Connect={{ server }}"]
profiles:
  A: { resolution: native, fps_cap: refresh }
  B: { resolution: native, fps_cap: 144 }
  C: { resolution: native, fps_cap: 60 }
art: { hue: 352, glow: 8, motif: hex }
