---
# Configures a gaming seat. Two ways to run it:
#   push, from the server:  ansible-playbook seat.yml -l canary --check --diff
#   pull, on the seat:      seat-pull.service runs ansible-pull with -e target=localhost
- name: Configure gaming seats
  hosts: "{{ target | default('seats') }}"
  become: true

  pre_tasks:
    - name: Load seat-local settings written by an earlier push run
      ansible.builtin.include_vars:
        file: /etc/seat/local-vars.yml
      when: (ansible_connection | default('ssh')) == 'local' and '/etc/seat/local-vars.yml' is file

  roles:
    - base
    - accounts
    - tier
    - games
    - session
    - launcher
    - updates
    - pull

  post_tasks:
    # Before the sudo rules go: the first run may still need one to reboot.
    - name: Reboot into the updated kernel (first run only)
      ansible.builtin.reboot:
        msg: "gaming-room: rebooting into the updated kernel"
        reboot_timeout: 900
      when: seat_reboot_needed | default(false)

    # Last on purpose: the run itself may be using one of these rules.
    - name: Remove temporary sudo rules
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ seat_temporary_sudoers }}"
      when: item is match('^/etc/sudoers\\.d/') and item != '/etc/sudoers.d/10-orchestrator'
