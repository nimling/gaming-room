---
# Configures the gaming server (Ubuntu Server LTS): Docker, firewall,
# Mumble, Lancache and Wake-on-LAN. Run from a machine on the gaming VLAN:
#   ansible-playbook server.yml --check --diff
#   ansible-playbook server.yml
- name: Configure the gaming server
  hosts: "{{ target | default('server') }}"
  become: true

  roles:
    - server_base
    - server_mumble
    - server_lancache
    - server_wol
    - server_claude
