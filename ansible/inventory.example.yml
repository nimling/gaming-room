# Copy to inventory.yml (gitignored) and fill in real hosts and keys.
# Placeholders only in this file: the repo is public.
all:
  vars:
    ansible_user: orchestrator
    # Public keys allowed to SSH in. Password SSH logins are turned off.
    seat_admin_ssh_keys:
      - "ssh-ed25519 AAAA...replace-me admin@example"
    seat_orchestrator_ssh_keys:
      - "ssh-ed25519 AAAA...replace-me orchestrator@gaming-server"
    # Where the orchestrator may log in from: the server, plus the Mac that
    # drives Ansible until Claude Code runs on the server.
    seat_orchestrator_source: ["192.0.2.10", "198.51.100.20"]
    # Optional: sudo password for admin, as a hash (mkpasswd -m sha-512).
    # seat_admin_password_hash: "$6$..."
  children:
    canary:
      vars:
        seat_config_branch: main      # the canary follows main; the rest follow stable
      hosts:
        seat-01:
    seats:
      hosts:
        seat-01:
          # Real address and MAC go in inventory.yml only.
          # ansible_host: 192.0.2.21
          # seat_mac: "00:00:5e:00:53:01"   # for wake-seats
        seat-02:
        seat-03:
        seat-04:
        seat-05:
        seat-06:
        seat-07:
        seat-08:
        seat-09:
        seat-10:
    server:
      vars:
        # The account the Ubuntu installer made (keys imported from GitHub).
        ansible_user: replace-me
      hosts:
        gaming-server:
          ansible_host: 192.0.2.10
