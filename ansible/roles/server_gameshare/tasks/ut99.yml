---
# --- Unreal Tournament (GOTY) on OldUnreal 469e ------------------------------
# Built once here from the pinned downloads; seats copy the finished folder.
- name: UT99 | install the unpack tools
  ansible.builtin.apt:
    name:
      - 7zip
      - bzip2
    state: present

- name: UT99 | create the download cache
  ansible.builtin.file:
    path: "{{ ut99_cache }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: UT99 | download the GOTY CD (650 MB)
  when: ut99_build
  block:
    - name: UT99 | download the GOTY CD from OldUnreal
      ansible.builtin.get_url:
        url: "{{ ut99_iso_url }}"
        dest: "{{ ut99_cache }}/UT_GOTY_CD1.ISO"
        checksum: "sha256:{{ ut99_iso_sha256 }}"
        mode: "0644"
        timeout: 120
  rescue:
    - name: UT99 | download the GOTY CD from archive.org instead
      ansible.builtin.get_url:
        url: "{{ ut99_iso_fallback_url }}"
        dest: "{{ ut99_cache }}/UT_GOTY_CD1.ISO"
        checksum: "sha256:{{ ut99_iso_sha256 }}"
        mode: "0644"
        timeout: 120
      # In a dry run of a fresh server the cache folder does not exist yet.
      ignore_errors: "{{ ansible_check_mode }}"

- name: UT99 | download Bonus Pack 4
  ansible.builtin.get_url:
    url: "{{ ut99_bp4_url }}"
    dest: "{{ ut99_cache }}/utbonuspack4-zip.7z"
    checksum: "sha256:{{ ut99_bp4_sha256 }}"
    mode: "0644"
  # In a dry run of a fresh server the cache folder does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: ut99_build

- name: UT99 | download the OldUnreal patch
  ansible.builtin.get_url:
    url: "{{ ut99_patch_url }}"
    dest: "{{ ut99_cache }}/{{ ut99_patch_file }}"
    checksum: "sha256:{{ ut99_patch_sha256 }}"
    mode: "0644"
  # In a dry run of a fresh server the cache folder does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: ut99_build

- name: UT99 | download the mods
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ ut99_cache }}/{{ item.file }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0644"
  loop: "{{ ut99_mods }}"
  loop_control:
    label: "{{ item.name }}"
  # In a dry run of a fresh server the cache folder does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: ut99_build

- name: UT99 | install the build script
  ansible.builtin.copy:
    src: ut99-build
    dest: /usr/local/sbin/ut99-build
    owner: root
    group: root
    mode: "0755"

- name: UT99 | read the built version
  ansible.builtin.slurp:
    src: "{{ ut99_dir }}/.ut99-version"
  register: ut99_built
  failed_when: false

- name: UT99 | work out the wanted version
  ansible.builtin.set_fact:
    ut99_version_line: >-
      iso={{ ut99_iso_sha256 }} bp4={{ ut99_bp4_sha256 }} patch={{ ut99_patch_version }}{%
      for m in ut99_mods %} {{ m.name }}={{ m.sha256[:12] }}{% endfor %}

# A few minutes: unpacks 650 MB and decompresses every map.
- name: UT99 | build the game folder
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/sbin/ut99-build',
          ut99_cache ~ '/UT_GOTY_CD1.ISO',
          ut99_cache ~ '/utbonuspack4-zip.7z',
          ut99_cache ~ '/' ~ ut99_patch_file,
          ut99_dir, gameshare_owner, ut99_version_line]
         + (ut99_mods | map(attribute='file') | map('regex_replace', '^', ut99_cache ~ '/') | list) }}
  changed_when: true
  # The build swaps the folder; the running server would keep the old,
  # deleted one and fail at the next map change.
  notify: Restart the UT99 game servers
  when: ut99_build and (ut99_built.content | default('') | b64decode | trim) != ut99_version_line

# --- The old dedicated server ---------------------------------------------------
# The always-on UT99 server is now a game server preset (server/presets/
# ut99-classic.yaml, roles/server_gameservers) on the same ports. Remove the
# old service so the ports are free; its account and home stay.
- name: UT99 server | stop the old service
  ansible.builtin.systemd_service:
    name: ut99-server.service
    enabled: false
    state: stopped
  when: not server_in_container
  failed_when: false

- name: UT99 server | remove the old service
  ansible.builtin.file:
    path: /etc/systemd/system/ut99-server.service
    state: absent
