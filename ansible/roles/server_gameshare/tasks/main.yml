---
- name: Install rsync and unzip
  ansible.builtin.apt:
    name:
      - rsync
      - unzip
    state: present

# The person account owns the share, so game files can be copied in by hand.
- name: Create the game share folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ gameshare_owner }}"
    group: "{{ gameshare_owner }}"
    mode: "0755"
  loop: >-
    {{ [gameshare_root, iw4x_dir]
       + (gameshare_engine_games | map(attribute='name') | map('regex_replace', '^', gameshare_root ~ '/') | list) }}

- name: Serve the game share read-only over rsync
  ansible.builtin.template:
    src: rsyncd.conf.j2
    dest: /etc/rsyncd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyncd

- name: Run the rsync daemon
  ansible.builtin.systemd_service:
    name: rsync.service
    enabled: true
    state: started
  when: not server_in_container
  # In a dry run of a fresh server rsync is not installed yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Firewall | allow the gaming VLAN to reach the game share
  community.general.ufw:
    rule: allow
    from_ip: "{{ server_vlan_cidr }}"
    port: "{{ gameshare_port }}"
    proto: tcp
  when: not server_in_container

# --- MW2 (2009) with IW4x ----------------------------------------------------
# Same steps as IW4x's Linux guide: iw4x.dll and the raw files (release.zip,
# which holds iw4x.exe) go into the MW2 folder. Done once here; seats copy the
# finished folder, so all ten run the same build.
- name: IW4x | refuse unpinned downloads
  ansible.builtin.assert:
    that:
      - iw4x_client_sha256 | length == 64
      - iw4x_rawfiles_sha256 | length == 64
    fail_msg: Set iw4x_client_sha256 and iw4x_rawfiles_sha256; the client runs on every seat.

- name: IW4x | look for the MW2 game files
  ansible.builtin.stat:
    path: "{{ iw4x_dir }}/iw4mp.exe"
  register: iw4x_base_game

- name: IW4x | say what is missing
  ansible.builtin.debug:
    msg: >-
      No MW2 in {{ iw4x_dir }} yet (iw4mp.exe not found), so IW4x was not
      installed. Copy the Steam install there first; see docs/iw4x.md.
  when: not iw4x_base_game.stat.exists

- name: IW4x | read the installed version
  ansible.builtin.slurp:
    src: "{{ iw4x_dir }}/.iw4x-version"
  register: iw4x_installed
  failed_when: false
  when: iw4x_base_game.stat.exists

- name: IW4x | work out whether the raw files need unpacking
  ansible.builtin.set_fact:
    iw4x_version_line: "client={{ iw4x_client_version }} rawfiles={{ iw4x_rawfiles_version }}"
    iw4x_rawfiles_current: >-
      {{ (iw4x_installed.content | default('') | b64decode)
         is search('rawfiles=' ~ iw4x_rawfiles_version ~ '$', multiline=true) }}
  when: iw4x_base_game.stat.exists

- name: IW4x | create the download cache
  ansible.builtin.file:
    path: "{{ iw4x_cache }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: iw4x_base_game.stat.exists

- name: IW4x | download the client (iw4x.dll)
  ansible.builtin.get_url:
    url: "{{ iw4x_client_url }}"
    dest: "{{ iw4x_cache }}/iw4x-{{ iw4x_client_version }}.dll"
    checksum: "sha256:{{ iw4x_client_sha256 }}"
    mode: "0644"
  # In a dry run of a fresh server the cache folder does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: iw4x_base_game.stat.exists

- name: IW4x | download the raw files (release.zip, about 750 MB)
  ansible.builtin.get_url:
    url: "{{ iw4x_rawfiles_url }}"
    dest: "{{ iw4x_cache }}/release-{{ iw4x_rawfiles_version }}.zip"
    checksum: "sha256:{{ iw4x_rawfiles_sha256 }}"
    mode: "0644"
    timeout: 120
  # In a dry run of a fresh server the cache folder does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: iw4x_base_game.stat.exists and not iw4x_rawfiles_current

- name: IW4x | unpack the raw files into the MW2 folder
  ansible.builtin.unarchive:
    src: "{{ iw4x_cache }}/release-{{ iw4x_rawfiles_version }}.zip"
    dest: "{{ iw4x_dir }}"
    remote_src: true
    owner: "{{ gameshare_owner }}"
    group: "{{ gameshare_owner }}"
  when: iw4x_base_game.stat.exists and not iw4x_rawfiles_current
  # In a dry run the download does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: IW4x | put the client next to the game
  ansible.builtin.copy:
    src: "{{ iw4x_cache }}/iw4x-{{ iw4x_client_version }}.dll"
    dest: "{{ iw4x_dir }}/iw4x.dll"
    remote_src: true
    owner: "{{ gameshare_owner }}"
    group: "{{ gameshare_owner }}"
    mode: "0644"
  when: iw4x_base_game.stat.exists
  # In a dry run the download does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: IW4x | record the installed version
  ansible.builtin.copy:
    dest: "{{ iw4x_dir }}/.iw4x-version"
    content: "{{ iw4x_version_line }}\n"
    owner: "{{ gameshare_owner }}"
    group: "{{ gameshare_owner }}"
    mode: "0644"
  when: iw4x_base_game.stat.exists

# rsyncd runs as nobody, and files copied in from elsewhere are not always
# world-readable.
- name: IW4x | make the game files readable for the rsync daemon
  ansible.builtin.file:
    path: "{{ iw4x_dir }}"
    recurse: true
    mode: "u+rwX,go+rX"
  when: iw4x_base_game.stat.exists

- name: Bought games on open-source engines
  ansible.builtin.include_tasks: engine_game.yml
  loop: "{{ gameshare_engine_games }}"
  loop_control:
    loop_var: engine_game
    label: "{{ engine_game.name }}"

- name: Unreal Tournament
  ansible.builtin.include_tasks: ut99.yml

- name: Unreal Tournament 2004
  ansible.builtin.include_tasks: ut2004.yml
