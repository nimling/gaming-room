---
- name: Install rsync and unzip
  ansible.builtin.apt:
    name:
      - rsync
      - unzip
    state: present

# The person account owns the share, so game files can be copied in by hand.
- name: Create the game share folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ gameshare_owner }}"
    group: "{{ gameshare_owner }}"
    mode: "0755"
  # Worms and WoW: copied in by hand (docs/worms.md, docs/wow-forever.md).
  # battlenet/prefix: filled by battlenet-prefix-publish (below).
  loop: >-
    {{ [gameshare_root, iw4x_dir, gameshare_root ~ '/worms', gameshare_root ~ '/wow',
        gameshare_root ~ '/battlenet', battlenet_prefix_share]
       + (gameshare_engine_games | map(attribute='name') | map('regex_replace', '^', gameshare_root ~ '/') | list) }}

- name: Serve the game share read-only over rsync
  ansible.builtin.template:
    src: rsyncd.conf.j2
    dest: /etc/rsyncd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyncd

- name: Run the rsync daemon
  ansible.builtin.systemd_service:
    name: rsync.service
    enabled: true
    state: started
  when: not server_in_container
  # In a dry run of a fresh server rsync is not installed yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Firewall | allow the gaming VLAN to reach the game share
  community.general.ufw:
    rule: allow
    from_ip: "{{ server_vlan_cidr }}"
    port: "{{ gameshare_port }}"
    proto: tcp
  when: not server_in_container

# --- MW2 (2009) with IW4x ----------------------------------------------------
# Same steps as IW4x's Linux guide: iw4x.dll and the raw files (release.zip,
# which holds iw4x.exe) go into the MW2 folder. Done once here; seats copy the
# finished folder, so all ten run the same build.
- name: IW4x | refuse unpinned downloads
  ansible.builtin.assert:
    that:
      - iw4x_client_sha256 | length == 64
      - iw4x_rawfiles_sha256 | length == 64
    fail_msg: Set iw4x_client_sha256 and iw4x_rawfiles_sha256; the client runs on every seat.

- name: IW4x | look for the MW2 game files
  ansible.builtin.stat:
    path: "{{ iw4x_dir }}/iw4mp.exe"
  register: iw4x_base_game

- name: IW4x | say what is missing
  ansible.builtin.debug:
    msg: >-
      No MW2 in {{ iw4x_dir }} yet (iw4mp.exe not found), so IW4x was not
      installed. Copy the Steam install there first; see docs/iw4x.md.
  when: not iw4x_base_game.stat.exists

- name: IW4x | read the installed version
  ansible.builtin.slurp:
    src: "{{ iw4x_dir }}/.iw4x-version"
  register: iw4x_installed
  failed_when: false
  when: iw4x_base_game.stat.exists

- name: IW4x | work out whether the raw files need unpacking
  ansible.builtin.set_fact:
    iw4x_version_line: "client={{ iw4x_client_version }} rawfiles={{ iw4x_rawfiles_version }}"
    iw4x_rawfiles_current: >-
      {{ (iw4x_installed.content | default('') | b64decode)
         is search('rawfiles=' ~ iw4x_rawfiles_version ~ '$', multiline=true) }}
  when: iw4x_base_game.stat.exists

- name: IW4x | create the download cache
  ansible.builtin.file:
    path: "{{ iw4x_cache }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: iw4x_base_game.stat.exists

- name: IW4x | download the client (iw4x.dll)
  ansible.builtin.get_url:
    url: "{{ iw4x_client_url }}"
    dest: "{{ iw4x_cache }}/iw4x-{{ iw4x_client_version }}.dll"
    checksum: "sha256:{{ iw4x_client_sha256 }}"
    mode: "0644"
  # In a dry run of a fresh server the cache folder does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: iw4x_base_game.stat.exists

- name: IW4x | download the raw files (release.zip, about 750 MB)
  ansible.builtin.get_url:
    url: "{{ iw4x_rawfiles_url }}"
    dest: "{{ iw4x_cache }}/release-{{ iw4x_rawfiles_version }}.zip"
    checksum: "sha256:{{ iw4x_rawfiles_sha256 }}"
    mode: "0644"
    timeout: 120
  # In a dry run of a fresh server the cache folder does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
  when: iw4x_base_game.stat.exists and not iw4x_rawfiles_current

- name: IW4x | unpack the raw files into the MW2 folder
  ansible.builtin.unarchive:
    src: "{{ iw4x_cache }}/release-{{ iw4x_rawfiles_version }}.zip"
    dest: "{{ iw4x_dir }}"
    remote_src: true
    owner: "{{ gameshare_owner }}"
    group: "{{ gameshare_owner }}"
  when: iw4x_base_game.stat.exists and not iw4x_rawfiles_current
  # In a dry run the download does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: IW4x | put the client next to the game
  ansible.builtin.copy:
    src: "{{ iw4x_cache }}/iw4x-{{ iw4x_client_version }}.dll"
    dest: "{{ iw4x_dir }}/iw4x.dll"
    remote_src: true
    owner: "{{ gameshare_owner }}"
    group: "{{ gameshare_owner }}"
    mode: "0644"
  when: iw4x_base_game.stat.exists
  # In a dry run the download does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: IW4x | record the installed version
  ansible.builtin.copy:
    dest: "{{ iw4x_dir }}/.iw4x-version"
    content: "{{ iw4x_version_line }}\n"
    owner: "{{ gameshare_owner }}"
    group: "{{ gameshare_owner }}"
    mode: "0644"
  when: iw4x_base_game.stat.exists

# rsyncd runs as nobody, and files copied in from elsewhere are not always
# world-readable.
- name: IW4x | make the game files readable for the rsync daemon
  ansible.builtin.file:
    path: "{{ iw4x_dir }}"
    recurse: true
    mode: "u+rwX,go+rX"
  when: iw4x_base_game.stat.exists

# --- World of Warcraft: Forever ---------------------------------------------
# Copied in by hand from a Battle.net install (docs/wow-forever.md). Seats
# copy it once and Battle.net patches it there.
- name: WoW | look for the game files
  ansible.builtin.stat:
    path: "{{ gameshare_root }}/wow/.build.info"
  register: wow_share_game

# rsyncd runs as nobody, and files copied from Windows are not always
# world-readable.
- name: WoW | make the game files readable for the rsync daemon
  ansible.builtin.file:
    path: "{{ gameshare_root }}/wow"
    recurse: true
    mode: "u+rwX,go+rX"
  when: wow_share_game.stat.exists

# --- Battle.net, set up once on the canary ------------------------------------
# A person sets Battle.net up on the canary, signs out and publishes the
# prefix here (docs/wow-forever.md, step 3). Seats copy it into their golden
# home. The publish refuses a prefix with logins, with the same check and
# list as golden capture and gate 1, so both come from roles/session.
- name: Battle.net | create the token list folder
  ansible.builtin.file:
    path: /usr/local/share/seat
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Battle.net | install the login token check and its list (from roles/session)
  ansible.builtin.copy:
    src: "{{ role_path }}/../session/files/{{ item.name }}"
    dest: "{{ item.dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { name: seat-token-check, dir: /usr/local/sbin, mode: "0755" }
    - { name: token-paths, dir: /usr/local/share/seat, mode: "0644" }

- name: Battle.net | install the publish script
  ansible.builtin.copy:
    src: battlenet-prefix-publish
    dest: /usr/local/sbin/battlenet-prefix-publish
    owner: root
    group: root
    mode: "0755"

- name: Battle.net | tell the publish script where to copy and whose key to use
  ansible.builtin.copy:
    dest: /etc/default/battlenet-prefix-publish
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by gaming-room Ansible (roles/server_gameshare).
      BATTLENET_PREFIX_SHARE={{ battlenet_prefix_share }}
      BATTLENET_PUBLISH_SSH_AS={{ server_claude_user | default('claude') }}
      BATTLENET_PUBLISH_LOGIN={{ battlenet_publish_login }}

- name: TrackMania Nations Forever
  ansible.builtin.include_tasks: tmnf.yml

- name: Bought games on open-source engines
  ansible.builtin.include_tasks: engine_game.yml
  loop: "{{ gameshare_engine_games }}"
  loop_control:
    loop_var: engine_game
    label: "{{ engine_game.name }}"

- name: Unreal Tournament
  ansible.builtin.include_tasks: ut99.yml

- name: Unreal Tournament 2004
  ansible.builtin.include_tasks: ut2004.yml
