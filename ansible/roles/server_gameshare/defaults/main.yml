---
# Shared game files for the seats, served read-only over rsync on the gaming
# VLAN. Seats copy from here (roles/games) at boot and nightly.
gameshare_root: /srv/games
# Owner of the share, so a person can copy game files in. Set it to the
# person account in the private inventory: the default (the account that runs
# the playbook) differs between the Mac and the server's claude account.
gameshare_owner: "{{ server_login_user }}"
gameshare_module: games
gameshare_port: 873
# Seats sync at the same time after Wake-on-LAN; this caps the load.
gameshare_max_connections: 12

# --- MW2 (2009) with IW4x ----------------------------------------------------
# Copy the Steam install of MW2 into this folder by hand (see docs/iw4x.md).
# Once iw4mp.exe is there, this role adds IW4x on top of it.
iw4x_dir: "{{ gameshare_root }}/mw2"
# Pinned so every seat runs the same IW4x; seats on different builds cannot
# play together. To update: change the versions, run server.yml, and the
# seats pick it up at their next pull.
iw4x_client_version: r5083
iw4x_rawfiles_version: v0.2.36
# sha256 of each pinned download. Required: iw4x.dll runs on every seat.
# GitHub lists them per release asset:
#   gh api repos/iw4x/iw4x-client/releases/tags/<version> --jq '.assets[] | {name, digest}'
iw4x_client_sha256: 50f3250e69bc970bcb17dd22c0b2a00299892ebc5bb4780ba37aeaf6319c31fc
iw4x_rawfiles_sha256: 1e80420c02397e872e02581d3a083b31db99c443a8449267c8a2108bff6e2260
iw4x_client_url: "https://github.com/iw4x/iw4x-client/releases/download/{{ iw4x_client_version }}/iw4x.dll"
iw4x_rawfiles_url: "https://github.com/iw4x/iw4x-rawfiles/releases/download/{{ iw4x_rawfiles_version }}/release.zip"
iw4x_cache: /var/cache/iw4x

# --- Unreal Tournament (GOTY) on OldUnreal 469e -------------------------------
# Free from Epic and OldUnreal; no CD key. The server builds the game once
# from the GOTY ISO, Bonus Pack 4 and the 469e Linux patch (files/ut99-build,
# the same steps as OldUnreal's install-ut99.sh), and seats copy the result.
ut99_dir: "{{ gameshare_root }}/ut99"
# Downloads and builds the game. Off in the container test (no 730 MB downloads).
ut99_build: "{{ not server_in_container }}"
ut99_cache: /var/cache/ut99
# Pinned: 469f changes the folder layout. To update, change the patch and its
# checksum, run server.yml, and seats pick it up at their next pull.
ut99_patch_version: 469e
ut99_patch_file: "OldUnreal-UTPatch{{ ut99_patch_version }}-Linux-amd64.tar.bz2"
ut99_patch_url: "https://github.com/OldUnreal/UnrealTournamentPatches/releases/download/v{{ ut99_patch_version }}/{{ ut99_patch_file }}"
ut99_patch_sha256: 08c806aa3721b1970045aa158ad90051329d982e8a9a3661153900e9ccbf6b0c
ut99_iso_url: https://files.oldunreal.net/UT_GOTY_CD1.ISO
ut99_iso_fallback_url: https://archive.org/download/ut-goty/UT_GOTY_CD1.iso
ut99_iso_sha256: e184984ca88f001c5ddd52035d76cd64e266e26c74975161b5ed72366c74704f
ut99_bp4_url: https://files.oldunreal.net/utbonuspack4-zip.7z
ut99_bp4_sha256: 5b7a1080724a122a596c226c50d4dc7c2d7636ceaf067e9c12112014a170ffba

# Mods built into the game folder, so the server and every seat have the
# same files. Each zip is laid out like the game folder. Pinned by sha256;
# changing the list rebuilds the game (about a minute, from the cache).
ut99_mods:
  # Monster Hunt: co-op against the monsters of Unreal, 8 MH and 4 MA maps.
  # SHA1 d887e9cf04aa484253bd99917e1649fd03f8d9d1 matches unrealarchive.org.
  - name: monsterhunt613
    file: MonsterHunt613.zip
    url: https://github.com/shrimpza/monsterhunt/releases/download/releases%2Fv613/MonsterHunt613.zip
    sha256: 5c23fa6ac2efc714784c8020c72d1acefb24027952835a7565d537c38fa86622

# --- Unreal Tournament 2004 on OldUnreal 3374 --------------------------------
# Free again: Epic approved OldUnreal's release; no CD key. The server builds
# the game from the Editor's Choice DVD image and the 3374 Linux patch
# (files/ut2004-build, the same steps as OldUnreal's install-ut2004.sh), and
# seats copy the result.
ut2004_dir: "{{ gameshare_root }}/ut2004"
# Downloads and builds the game. Off in the container test (3 GB download).
ut2004_build: "{{ not server_in_container }}"
ut2004_cache: /var/cache/ut2004
# Pinned. To update, change the tag, file and checksum (GitHub lists the
# digest per release asset), run server.yml, and seats pick it up at their
# next pull:
#   gh api repos/OldUnreal/UT2004Patches/releases/tags/<tag> --jq '.assets[] | {name, digest}'
ut2004_patch_version: 3374-rc3
ut2004_patch_file: OldUnreal-UT2004Patch3374-Linux-fc0484d6.tar.bz2
ut2004_patch_url: "https://github.com/OldUnreal/UT2004Patches/releases/download/{{ ut2004_patch_version }}/{{ ut2004_patch_file }}"
ut2004_patch_sha256: d79eb45fda3ace2b7a68e6a0b9730b7d6602004b111e0b16f3f7cc28f3111572
ut2004_iso_url: https://files.oldunreal.net/UT2004.ISO
ut2004_iso_fallback_url: https://files2.oldunreal.net/UT2004.ISO
ut2004_iso_sha256: 43e9182ae20bcbc0f6f4588fee6c1b336c261f1465403118a1973b09b1a22541

# Dedicated LAN server, from the same files. Off until switched on in the
# private inventory. It answers LAN browser queries on the gaming VLAN only.
ut99_server_enabled: false
ut99_server_user: ut99server
ut99_server_home: /var/lib/ut99-server
ut99_server_port: 7777
ut99_server_url: "DM-Deck16][?game=Botpack.DeathMatchPlus?mutator=Botpack.InstaGibDM"
