---
- name: Restart rsyncd
  ansible.builtin.systemd_service:
    name: rsync.service
    state: restarted
  when: not server_in_container

# The build swaps the game folder; running UT99 game servers would keep the
# old, deleted one and fail at the next map change.
- name: Restart the UT99 game servers
  ansible.builtin.command:
    argv: [systemctl, try-restart, "gs-ut99-*.service"]
  changed_when: true
  when: not server_in_container
  # In a dry run nothing was rebuilt.
  ignore_errors: "{{ ansible_check_mode }}"
