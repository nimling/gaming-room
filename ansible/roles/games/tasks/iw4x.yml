---
# --- MW2 (2009) with IW4x ----------------------------------------------------
# The game folder comes from the share (shared.yml, entry mw2 in
# seat_shared_games). This adds the start script that runs it.
- name: IW4x | install the start script
  ansible.builtin.copy:
    src: iw4x-seat
    dest: /usr/local/bin/iw4x-seat
    owner: root
    group: root
    mode: "0755"
