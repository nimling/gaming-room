---
# Builds the Arcade launcher on the seat from this repo, installs it and
# starts it full screen when the player logs in. See launcher/README.md.

- name: Install the launcher's runtime and build packages
  community.general.pacman:
    name:
      - flatpak
      - gamemode
      - gamescope
      - gcc
      - git
      - mumble
      - openssl
      - pkgconf
      - playerctl
      - python-cryptography
      - rust
      - spectacle
      - sqlite
      - umu-launcher
      - webkit2gtk-4.1
    state: present

# Crates run build scripts, so the build runs as an unprivileged account.
- name: Create the launcher build account
  ansible.builtin.user:
    name: arcade-build
    system: true
    home: "{{ arcade_build_root }}"
    create_home: true
    shell: /usr/bin/nologin
    password_lock: true

- name: Fetch the launcher source
  ansible.builtin.git:
    repo: "{{ seat_config_repo }}"
    dest: "{{ arcade_build_root }}/src"
    version: "{{ arcade_source_branch }}"
    depth: 1
    force: true
  become: true
  become_user: arcade-build
  register: arcade_src
  when: not seat_in_container
  # In a dry run of a fresh seat the build account and build do not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Look for the installed launcher
  ansible.builtin.stat:
    path: /usr/local/bin/arcade-app
  register: arcade_installed

- name: Build the launcher (a few minutes the first time)
  ansible.builtin.command:
    cmd: cargo build --release --locked -p arcade-cli -p arcade-app
    chdir: "{{ arcade_build_root }}/src/launcher"
  environment:
    CARGO_HOME: "{{ arcade_build_root }}/cargo"
    CARGO_TARGET_DIR: "{{ arcade_build_root }}/target"
  become: true
  become_user: arcade-build
  changed_when: true
  # Skipped in dry runs: the build account does not exist yet on a fresh seat.
  when: not seat_in_container and not ansible_check_mode and (arcade_src is changed or not arcade_installed.stat.exists)  # noqa: no-handler

- name: Install the launcher programs
  ansible.builtin.copy:
    src: "{{ arcade_build_root }}/target/release/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - arcade
    - arcade-app
  when: not seat_in_container
  # In a dry run of a fresh seat the build account and build do not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

# --- Music: Spotify from Flathub ----------------------------------------------
# Installed for all users, so the player cannot change it; polkit refuses the
# player's Flatpak actions. The login lives in ~/.var/app and goes at the
# reset. The launcher's mini player steers it with playerctl.
- name: Spotify | add the Flathub remote
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present
  when: arcade_spotify
  # In a dry run of a seat without Flatpak, the package is not installed yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Spotify | install the app
  community.general.flatpak:
    name: com.spotify.Client
    remote: flathub
    method: system
    state: "{{ 'present' if arcade_spotify else 'absent' }}"
  # Skipped in the test container: it would pull Spotify and its runtime from
  # Flathub on every CI run.
  when: not seat_in_container
  # In a dry run of a fresh seat Flatpak is not installed yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create the launcher folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/arcade
    - "{{ arcade_games_dir }}"

- name: Install the game manifests
  ansible.builtin.copy:
    src: "{{ arcade_build_root }}/src/games/"
    dest: "{{ arcade_games_dir }}/"
    remote_src: true
    owner: root
    group: root
    mode: "u=rwX,go=rX"
  when: not seat_in_container
  # In a dry run of a fresh seat the build account and build do not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

# Only a push run sees the whole inventory; it starts from the empty
# default and adds each host that has an address. The pull role saves the
# list in local-vars for pull runs.
- name: Collect the seat and server addresses for the launcher (push runs)
  ansible.builtin.set_fact:
    arcade_hosts: "{{ arcade_hosts + [{'name': item, 'address': hostvars[item].seat_lan_address | default(hostvars[item].ansible_host)}] }}"
  loop: "{{ (groups['server'] | default([]) | sort) + (groups['seats'] | default([]) | sort) }}"
  when:
    - (ansible_connection | default('ssh')) != 'local'
    - hostvars[item].seat_lan_address is defined or hostvars[item].ansible_host is defined

- name: Write the launcher settings
  ansible.builtin.template:
    src: arcade.yaml.j2
    dest: /etc/arcade/arcade.yaml
    owner: root
    group: root
    mode: "0644"

- name: Write the seat's screen size for the launcher
  ansible.builtin.copy:
    dest: /etc/seat/display
    content: "{{ seat_display }}\n"
    owner: root
    group: root
    mode: "0644"
  when: seat_display | length > 0

- name: Create the autostart folder in the golden home
  ansible.builtin.file:
    path: "/home/.golden/{{ seat_player_user }}/.config/autostart"
    state: directory
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0755"

- name: Start the launcher when the player logs in (from the next reset)
  ansible.builtin.copy:
    src: arcade.desktop
    dest: "/home/.golden/{{ seat_player_user }}/.config/autostart/arcade.desktop"
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0644"

# KWin does not always honour the app's own full-screen request at start,
# and KDE's taskbar stayed on top. A window rule forces it. A second rule
# starts Mumble minimised; Mumble then hides in the tray.
- name: Force the launcher to full screen and start Mumble minimised (KWin rules in the golden home)
  ansible.builtin.copy:
    src: kwinrulesrc
    dest: "/home/.golden/{{ seat_player_user }}/.config/kwinrulesrc"
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0644"

- name: OpenRA | create its settings folder in the golden home
  ansible.builtin.file:
    path: "/home/.golden/{{ seat_player_user }}/.config/openra"
    state: directory
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0755"

- name: OpenRA | use the shared Red Alert content in /games (no install dialog)
  ansible.builtin.file:
    src: "{{ seat_games_root }}/openra/Content"
    dest: "/home/.golden/{{ seat_player_user }}/.config/openra/Content"
    state: link
    force: true
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"

# --- Steam: games stay, logins go ----------------------------------------------
# Steam keeps its games in ~/.local/share/Steam/steamapps. The home is reset
# at every End session, so installed games would vanish. The golden home
# links that folder to /games/steam/steamapps, which survives the reset.
# Logins (config/, userdata/, registry.vdf) stay in the home and are wiped.
# seat-reset still empties steamapps/compatdata (Proton saves and logins).
- name: Steam | create the shared library in /games
  ansible.builtin.file:
    path: "{{ seat_steam_library }}/steamapps"
    state: directory
    owner: "{{ seat_player_user }}"
    group: "{{ seat_games_group }}"
    mode: "2775"

- name: Steam | create its folder in the golden home
  ansible.builtin.file:
    path: "/home/.golden/{{ seat_player_user }}/{{ item }}"
    state: directory
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0755"
  loop: [.local, .local/share, .local/share/Steam]

- name: Steam | install games into /games (golden home)
  ansible.builtin.file:
    src: "{{ seat_steam_library }}/steamapps"
    dest: "/home/.golden/{{ seat_player_user }}/.local/share/Steam/steamapps"
    state: link
    force: true
    # Owner of the link itself; following it would hand /games/steam to
    # the player's own group.
    follow: false
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"

# --- Unreal Tournament: the game's own default settings -----------------------
# The launcher writes the nickname and screen keys into ~/.utpg/System before
# the game starts. Without the full defaults under them, the game would find
# a settings file with only those keys and lose its renderer and other
# defaults. So the golden home starts with copies of the game's Default.ini
# and DefUser.ini, once the game is on the seat.
- name: UT99 | look for the game on the seat
  ansible.builtin.stat:
    path: "{{ seat_classic_root }}/ut99/System64/Default.ini"
  register: ut99_on_seat

- name: UT99 | create its settings folder in the golden home
  ansible.builtin.file:
    path: "/home/.golden/{{ seat_player_user }}/{{ item }}"
    state: directory
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0755"
  loop: [.utpg, .utpg/System]
  when: ut99_on_seat.stat.exists

- name: UT99 | start the golden home from the game's default settings
  ansible.builtin.copy:
    src: "{{ seat_classic_root }}/ut99/System64/{{ item.src }}"
    dest: "/home/.golden/{{ seat_player_user }}/.utpg/System/{{ item.dest }}"
    remote_src: true
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0644"
  loop:
    - { src: Default.ini, dest: UnrealTournament.ini }
    - { src: DefUser.ini, dest: User.ini }
  when: ut99_on_seat.stat.exists

- name: UT2004 | look for the game on the seat
  ansible.builtin.stat:
    path: "{{ seat_classic_root }}/ut2004/System/Default.ini"
  register: ut2004_on_seat

- name: UT2004 | create its settings folder in the golden home
  ansible.builtin.file:
    path: "/home/.golden/{{ seat_player_user }}/{{ item }}"
    state: directory
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0755"
  loop: [.ut2004, .ut2004/System]
  when: ut2004_on_seat.stat.exists

# The launcher sets a few keys on top at every start (games/ut2004.yaml).
- name: UT2004 | start the golden home from the game's default settings
  ansible.builtin.copy:
    src: "{{ seat_classic_root }}/ut2004/System/{{ item.src }}"
    dest: "/home/.golden/{{ seat_player_user }}/.ut2004/System/{{ item.dest }}"
    remote_src: true
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0644"
  loop:
    - { src: Default.ini, dest: UT2004.ini }
    - { src: DefUser.ini, dest: User.ini }
  when: ut2004_on_seat.stat.exists

# --- Voice: Mumble joins with no wizard or dialog -----------------------------
# Mumble 1.5 shows three dialogs on a fresh home: the audio wizard, the
# certificate wizard and "unknown server certificate". The settings file
# answers the first, a seat certificate the second, a pinned digest the third.

# Mumble looks for its certificate in the XDG Documents folder, whose name
# follows the locale. Fixed names make the path the same on every seat. The
# folders exist up front so xdg-user-dirs-update keeps the file as it is.
- name: Fix the player's XDG folder names (golden home)
  ansible.builtin.copy:
    src: user-dirs.dirs
    dest: "/home/.golden/{{ seat_player_user }}/.config/user-dirs.dirs"
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0644"

- name: Create the XDG and Mumble folders in the golden home
  ansible.builtin.file:
    path: "/home/.golden/{{ seat_player_user }}/{{ item }}"
    state: directory
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0755"
  loop:
    - Desktop
    - Documents
    - Downloads
    - Music
    - Pictures
    - Projects
    - Public
    - Templates
    - Videos
    - .config/Mumble
    - .config/Mumble/Mumble
    - .local
    - .local/share
    - .local/share/Mumble
    - .local/share/Mumble/Mumble

# Wizard done, 10 ms frames, noise suppression, no update checks. Mumble 1.5
# only speaks Opus, so there is no codec key.
# Push-to-talk reads /dev/input (evdev), so it works in every window, Wayland
# or X. Mumble stores a button as its Linux event code + 8 (a QVariant int):
# the mouse side button (BTN_SIDE 275) is 283, V (KEY_V 47) is 55.
- name: Pre-fill Mumble's settings (golden home)
  ansible.builtin.copy:
    src: mumble_settings.json
    dest: "/home/.golden/{{ seat_player_user }}/.config/Mumble/Mumble/mumble_settings.json"
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0644"

# Each seat makes its own certificate; the key never leaves the seat. It is
# kept outside the golden home so a rebuilt golden home gets the same one.
- name: Create the folder for the seat's Mumble certificate
  ansible.builtin.file:
    path: /etc/seat/mumble
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create the seat's Mumble key
  community.crypto.openssl_privatekey:
    path: /etc/seat/mumble/key.pem
    type: RSA
    size: 2048
    owner: root
    group: root
    mode: "0600"
  # In a dry run of a fresh seat the folder does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create the request for the seat's Mumble certificate
  community.crypto.openssl_csr_pipe:
    privatekey_path: /etc/seat/mumble/key.pem
    common_name: Gaming room seat
  register: arcade_mumble_csr
  changed_when: false
  # In a dry run of a fresh seat the key does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create the seat's Mumble certificate (self-signed)
  community.crypto.x509_certificate:
    path: /etc/seat/mumble/cert.pem
    privatekey_path: /etc/seat/mumble/key.pem
    csr_content: "{{ arcade_mumble_csr.csr | default('') }}"
    provider: selfsigned
    selfsigned_not_after: "+7300d"
    owner: root
    group: root
    mode: "0644"
  # In a dry run of a fresh seat the key does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

# With no certificate in its settings, Mumble loads this file from the
# Documents folder without asking. Without it, the certificate wizard opens.
- name: Give Mumble the seat's certificate (golden home)
  community.crypto.openssl_pkcs12:
    path: "/home/.golden/{{ seat_player_user }}/Documents/MumbleAutomaticCertificateBackup.p12"
    friendly_name: Gaming room seat
    privatekey_path: /etc/seat/mumble/key.pem
    certificate_path: /etc/seat/mumble/cert.pem
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0600"
  # In a dry run of a fresh seat the key and certificate do not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

# The server's certificate is self-signed, so Mumble asks before it trusts
# it. Mumble keeps accepted certificates in its database; we add the server's
# there. If the server is off, the pin from the last run stays.
# Recreating the mumble container's data volume makes a new server
# certificate. Seats then show the dialog again until the next playbook run
# pins the new one.
- name: Read the voice server's certificate
  community.crypto.get_certificate:
    host: "{{ arcade_voice_server }}"
    port: "{{ arcade_voice_port }}"
    timeout: 5
  register: arcade_voice_cert
  failed_when: false
  # Only reads, so it also runs in a dry run.
  check_mode: false
  when: arcade_voice_server | length > 0

- name: Work out the voice server certificate's digest
  community.crypto.x509_certificate_info:
    content: "{{ arcade_voice_cert.cert }}"
  register: arcade_voice_cert_info
  when: arcade_voice_cert.cert is defined

- name: Read the digest Mumble already trusts (golden home)
  ansible.builtin.command:
    argv:
      - sqlite3
      - -readonly
      - "/home/.golden/{{ seat_player_user }}/.local/share/Mumble/Mumble/mumble.sqlite"
      - "SELECT digest FROM cert WHERE hostname = '{{ arcade_voice_server }}' AND port = {{ arcade_voice_port }};"
  register: arcade_voice_pinned
  changed_when: false
  failed_when: false
  check_mode: false
  when: arcade_voice_cert_info.fingerprints is defined

- name: Trust the voice server's certificate in Mumble (golden home)
  ansible.builtin.command:
    argv:
      - sqlite3
      - "/home/.golden/{{ seat_player_user }}/.local/share/Mumble/Mumble/mumble.sqlite"
      - >-
        CREATE TABLE IF NOT EXISTS cert
        (id INTEGER PRIMARY KEY AUTOINCREMENT, hostname TEXT, port INTEGER, digest TEXT);
        CREATE UNIQUE INDEX IF NOT EXISTS cert_host_port ON cert(hostname, port);
        REPLACE INTO cert (hostname, port, digest)
        VALUES ('{{ arcade_voice_server }}', {{ arcade_voice_port }}, '{{ arcade_voice_digest }}');
  vars:
    arcade_voice_digest: "{{ arcade_voice_cert_info.fingerprints.sha1 | replace(':', '') | lower }}"
  changed_when: true
  when:
    - arcade_voice_cert_info.fingerprints is defined
    - arcade_voice_pinned.stdout | default('') != arcade_voice_digest

- name: Look for Mumble's database in the golden home
  ansible.builtin.stat:
    path: "/home/.golden/{{ seat_player_user }}/.local/share/Mumble/Mumble/mumble.sqlite"
  register: arcade_mumble_db

- name: Give Mumble's database to the player (golden home)
  ansible.builtin.file:
    path: "/home/.golden/{{ seat_player_user }}/.local/share/Mumble/Mumble/mumble.sqlite"
    owner: "{{ seat_player_user }}"
    group: "{{ seat_player_user }}"
    mode: "0600"
  when: arcade_mumble_db.stat.exists
