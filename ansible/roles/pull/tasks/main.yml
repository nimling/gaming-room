---
# Each seat pulls this repo and applies seat.yml at boot and every night.
# Canary seats follow main; the rest follow stable, which is moved forward to
# main once the canary has been fine for a day.
- name: Install git and Ansible
  community.general.pacman:
    name:
      - ansible
      - git
    state: present

- name: Keep the private settings for pull runs (written by a push run)
  ansible.builtin.template:
    src: local-vars.yml.j2
    dest: /etc/seat/local-vars.yml
    owner: root
    group: root
    mode: "0600"
  when: (ansible_connection | default('ssh')) != 'local'

- name: Install seat-pull units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - seat-pull.service
    - seat-pull.timer

- name: Enable the seat-pull timer (or keep it off while seat_pull_enabled is false)
  ansible.builtin.systemd_service:
    name: seat-pull.timer
    enabled: "{{ seat_pull_enabled | bool }}"
    state: "{{ 'started' if seat_pull_enabled | bool else 'stopped' }}"
    daemon_reload: true
  when: not seat_in_container
  # In a dry run of a fresh seat the unit file does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"
