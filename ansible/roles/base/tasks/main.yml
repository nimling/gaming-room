---
- name: Refuse to lock people out of SSH
  ansible.builtin.assert:
    that: seat_admin_ssh_keys | length > 0 or seat_allow_no_admin_keys
    fail_msg: >-
      seat_admin_ssh_keys is empty. Password SSH logins are turned off by this
      role, so set at least one admin key in the private inventory.

# A fresh seat may carry a months-old package list. On a rolling distro,
# installing anything on top of that fails or half-upgrades the system,
# so the first run updates everything once, then reboots into the new kernel.
- name: Check whether this seat has had its first full update
  ansible.builtin.stat:
    path: /etc/seat-first-update-done
  register: seat_first_update

- name: First run | update the package keyrings
  community.general.pacman:
    name:
      - archlinux-keyring
      - cachyos-keyring
    state: latest
    update_cache: true
  when: not seat_first_update.stat.exists and not seat_in_container

- name: First run | update the whole system
  community.general.pacman:
    upgrade: true
  register: seat_first_upgrade
  when: not seat_first_update.stat.exists and not seat_in_container

# A running sshd from before an OpenSSH upgrade cannot start the new
# sshd-session helper, so every new connection is reset until it restarts.
# Open sessions (this run's) survive the restart.
# Not a handler: it must run now, before the reboot below, not at play end.
- name: First run | restart sshd after the update  # noqa: no-handler
  ansible.builtin.systemd_service:
    name: sshd.service
    state: restarted
  when: seat_first_upgrade is changed

- name: First run | remember that the full update is done
  ansible.builtin.copy:
    dest: /etc/seat-first-update-done
    content: "Full system update by gaming-room Ansible before the first configuration.\n"
    owner: root
    group: root
    mode: "0644"

# The reboot itself runs at the end of the play (seat.yml post_tasks), so the
# auto-login and session settings are in place when the seat comes back.
- name: First run | remember to reboot into the updated kernel at the end
  ansible.builtin.set_fact:
    seat_reboot_needed: true
  when:
    - seat_first_update is not skipped
    - not seat_first_update.stat.exists
    - not seat_in_container
    - (ansible_connection | default('ssh')) != 'local'
    - ('/usr/lib/modules/' ~ ansible_kernel) is not directory

- name: Install base packages
  community.general.pacman:
    name:
      - btrfs-progs
      - git
      - networkmanager
      - openssh
      - pciutils
      - polkit
      - sudo
    state: present

- name: Create /etc/seat
  ansible.builtin.file:
    path: /etc/seat
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write shared seat settings for the seat-* scripts
  ansible.builtin.template:
    src: seat.conf.j2
    dest: /etc/seat/seat.conf
    owner: root
    group: root
    mode: "0644"

- name: Make sshd read drop-in files first
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    state: present
  notify: Reload sshd

- name: Create sshd drop-in folder
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Harden sshd (keys only, named users only)
  ansible.builtin.template:
    src: sshd-gaming-room.conf.j2
    dest: /etc/ssh/sshd_config.d/10-gaming-room.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd

- name: Look for ufw (CachyOS turns it on and drops SSH)
  ansible.builtin.stat:
    path: /usr/bin/ufw
  register: seat_ufw

- name: Firewall | allow SSH from the orchestrator's addresses
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ (([seat_orchestrator_source] if seat_orchestrator_source is string else seat_orchestrator_source) | select | list) or ['any'] }}"
  when: seat_ufw.stat.exists and not seat_in_container

# LAN games: a seat that hosts a match (WC3, UT, OpenRA, MW2) must accept the
# other seats' joins and answer their LAN-browser broadcasts. Each game uses
# its own ports, and some pick them at random, so the whole gaming VLAN may
# reach the seats. Nothing outside the VLAN can.
- name: Firewall | allow LAN games from the gaming network
  community.general.ufw:
    rule: allow
    from_ip: "{{ seat_lan_cidr }}"
  when: seat_ufw.stat.exists and not seat_in_container and seat_lan_cidr | length > 0

- name: Check sshd config before any reload
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Enable sshd and time sync
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - sshd.service
    - systemd-timesyncd.service
  when: not seat_in_container

- name: Create the NetworkManager config folder
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Turn on Wake-on-LAN (magic packet) for wired connections
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/60-wake-on-lan.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by gaming-room Ansible
      [connection]
      ethernet.wake-on-lan=64
