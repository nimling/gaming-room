---
# Public defaults. Real values (keys, addresses, hashes) go in the private
# inventory's group_vars, never in this repo.

seat_admin_user: admin
seat_player_user: player
seat_orchestrator_user: orchestrator
seat_games_group: games

# SSH public keys allowed to log in as admin / orchestrator.
seat_admin_ssh_keys: []
seat_orchestrator_ssh_keys: []

# Addresses or CIDRs the orchestrator may log in from: the server, and for
# now the Mac that drives Ansible. A single string also works.
# Empty = no address restriction; set it before go-live.
seat_orchestrator_source: []
# The gaming VLAN, allowed through the seat firewall so LAN games work (one
# seat hosts, the others join). Defaults to the seat's own subnet. Empty
# turns the rule off.
seat_lan_cidr: "{{ ansible_default_ipv4.network | default('') }}{{ ('/' ~ ansible_default_ipv4.prefix) if ansible_default_ipv4.prefix is defined else '' }}"
# Temporary sudo rules to delete at the end of a run, for example the one
# bootstrap/seat.sh adds so the installer's user can do the very first run.
# Deleting a file that is not there is a no-op, so this stays on for all seats.
seat_temporary_sudoers: ["/etc/sudoers.d/90-seat-bootstrap"]

# Extra users still allowed to SSH in, e.g. during migration.
seat_extra_ssh_users: []

# Set true only for throwaway test machines with no admin keys.
seat_allow_no_admin_keys: false

# Set true when testing inside a container: skips service enabling and
# hardware-only steps.
seat_in_container: false

# Paths
seat_games_root: /games
seat_steam_library: /games/steam
seat_classic_root: /games/classic

# Headset sidetone (hearing your own voice), 0-128; 0 = off. Logitech
# G431/G432/G433, set over HID by HeadsetControl at boot and on plug-in.
seat_headset_sidetone: 0

# Session
seat_idle_logout_enabled: true
seat_idle_logout_minutes: 20
seat_idle_warning_seconds: 60
seat_sddm_session: plasma

# Hardware tiers (MiB). A 16 GB machine reports ~15.5 GiB, hence the margins.
seat_tier_a_vram_mib: 7500
seat_tier_a_ram_mib: 15000
seat_tier_b_vram_mib: 3500
seat_tier_b_ram_mib: 7000
seat_tier_override: ""

# Updates
seat_update_freeze_until: ""   # YYYY-MM-DD; no updates before this date
seat_update_keep_snapshots: 3

# ansible-pull
seat_config_repo: https://github.com/nimling/gaming-room.git
seat_config_branch: stable     # the canary group overrides this with main
seat_pull_calendar: "*-*-* 03:30"
# Set false to keep the pull timer off, for example while the branch a seat
# follows does not yet have changes that were pushed to it from elsewhere.
seat_pull_enabled: true

# OpenRA Red Alert content (roles/games): OpenRA's Quick Install package
seat_openra_ra_mirrors: https://www.openra.net/packages/ra-quickinstall-mirrors.txt
seat_openra_ra_sha1: 44241f68e69db9511db82cf83c174737ccda300b

# Free LAN games from the CachyOS/Arch repos (roles/games), one manifest each
# in games/. Empty skips them.
seat_free_games:
  - openttd
  - openttd-opengfx
  - openttd-opensfx
  - teeworlds
  - xonotic

# Shared game files on the gaming server (roles/server_gameshare), as an
# rsync URL such as rsync://gaming-server/games. Private inventory.
# Empty: games from the share (MW2 with IW4x) are skipped.
seat_gameshare: ""
seat_mw2_dir: "{{ seat_classic_root }}/mw2"
# Games copied from the share. required: files that show the server has a
# finished install (rsync paths: no [ or ], they are wildcards there).
# exclude: rsync patterns that never come from the server.
# chmod: rsync --chmod for the copy (default D755,F644: nothing executable).
seat_shared_games:
  - name: mw2
    dest: "{{ seat_mw2_dir }}"
    required: [iw4mp.exe, iw4x.exe, iw4x.dll]
    # Each seat makes its own IW4x key.
    exclude: [/players/]
  - name: ut99
    dest: "{{ seat_classic_root }}/ut99"
    required: [System64/ut-bin, .ut99-version]
    exclude: []
    # Native Linux game: keep the execute bit on its programs.
    chmod: D755,Fu=rwX,Fgo=rX
  - name: ut2004
    dest: "{{ seat_classic_root }}/ut2004"
    required: [System/UT2004, .ut2004-version]
    # The patch also ships ARM64 and POWER builds.
    exclude: [/SystemARM64/, /SystemPPC64LE/]
    chmod: D755,Fu=rwX,Fgo=rX
# true: compare every file by content, not size and date. Slower; use it to
# repair a game folder that looks fine but crashes.
seat_gameshare_verify: false

# Proton for Windows games (roles/games). Pinned, so all seats match; to
# update, change both values. The digest is on the GitHub release:
#   gh api repos/GloriousEggroll/proton-ge-custom/releases/tags/<version> \
#     --jq '.assets[] | select(.name | endswith("x86_64.tar.gz")) | .digest'
seat_proton_version: GE-Proton11-12
seat_proton_sha256: 0595159e417c3dbbfb7cc3ae0d3ed15a617cc607aa23ef756ea79029d7af5d70
seat_proton_url: "https://github.com/GloriousEggroll/proton-ge-custom/releases/download/{{ seat_proton_version }}/{{ seat_proton_version }}-x86_64.tar.gz"
seat_runtime_root: "{{ seat_games_root }}/runtime"
# The tarball unpacks to <version>-x86_64.
seat_proton_dir: "{{ seat_runtime_root }}/{{ seat_proton_version }}-x86_64"
# umu keeps the Steam Runtime here instead of in the player's home.
seat_umu_folders: "{{ seat_runtime_root }}/umu"

# Launcher (roles/launcher)
arcade_source_branch: "{{ seat_config_branch }}"
arcade_build_root: /var/cache/arcade
arcade_games_dir: /usr/local/share/arcade/games
# Pinned GE-Proton in /games/runtime (roles/games). Every seat runs this build.
arcade_proton_path: "{{ seat_proton_dir }}"
# The gaming server's address for Mumble; set in the private inventory.
arcade_voice_server: ""
# Empty joins the root channel (named Lobby on our server).
arcade_voice_channel: ""
arcade_voice_port: 64738
# Seats and server shown on the launcher's IP addresses screen, as
# [{name, address}]. A push run fills it from the inventory (each host's
# seat_lan_address, else ansible_host); pull runs read it from local-vars.
arcade_hosts: []
# Spotify (Flathub) for the launcher's music button. false removes it.
arcade_spotify: true
# Screen size and refresh, for example 3440x1440@144; private inventory, per seat.
seat_display: ""
