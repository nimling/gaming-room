---
- name: Café | check the settings
  ansible.builtin.assert:
    that:
      - pccafe_bridge_nic | length > 0
      - (pccafe_bridge_nic | replace('-', '_')) in ansible_facts
    fail_msg: >-
      Set pccafe_bridge_nic in the private inventory: the server's NIC on the
      gaming VLAN, for example enp2s0.

- name: Café | check that KVM is available
  ansible.builtin.stat:
    path: /dev/kvm
  register: pccafe_kvm

- name: Café | stop without KVM
  ansible.builtin.assert:
    that: pccafe_kvm.stat.exists or server_in_container
    fail_msg: /dev/kvm is missing. Turn on AMD-V (SVM) in the firmware and load kvm_amd.

- name: Café | create the folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ pccafe_dir }}"
    - "{{ pccafe_dir }}/storage"
    - "{{ pccafe_dir }}/shared"
    - "{{ pccafe_dir }}/oem"

- name: Café | make the Windows password once
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    head -c 18 /dev/urandom | base64 | tr -d '/+=' > {{ pccafe_dir }}/windows-password
  args:
    creates: "{{ pccafe_dir }}/windows-password"
    executable: /bin/bash

- name: Café | read the Windows password
  ansible.builtin.slurp:
    src: "{{ pccafe_dir }}/windows-password"
  register: pccafe_password
  # In a dry run of a fresh server the file does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

# --- Network: NIC into a bridge, VM tap on the bridge ---------------------------
- name: Café | netplan folder
  ansible.builtin.file:
    path: /etc/netplan
    state: directory
    owner: root
    group: root
    mode: "0755"

# Sorts after the installer's 00-*.yaml and overrides the NIC's DHCP. The
# handler runs `netplan apply`; the first switch is better done by hand with
# `netplan try` (docs: server/README.md).
- name: Café | put the NIC into a bridge
  ansible.builtin.template:
    src: netplan-bridge.yaml.j2
    dest: /etc/netplan/60-gaming-room-bridge.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Apply the network settings

- name: Café | install the tap unit
  ansible.builtin.template:
    src: pccafe-tap.service.j2
    dest: /etc/systemd/system/pccafe-tap.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the café tap

# The bridge must exist before the tap joins it.
- name: Café | apply network changes now
  ansible.builtin.meta: flush_handlers

- name: Café | run the tap at boot
  ansible.builtin.systemd_service:
    name: pccafe-tap.service
    enabled: true
    state: started
    daemon_reload: true
  when: not server_in_container
  # In a dry run the unit file is not written.
  ignore_errors: "{{ ansible_check_mode }}"

# Forwarded bridge traffic only meets the firewall if br_netfilter is loaded
# (Docker can load it). Then this keeps the VLAN <-> VM traffic flowing.
- name: Café | let traffic cross the bridge
  community.general.ufw:
    rule: allow
    route: true
    interface_in: "{{ pccafe_bridge }}"
    interface_out: "{{ pccafe_bridge }}"
  when: not server_in_container

- name: Café | web viewer, from the gaming VLAN only
  community.general.ufw:
    rule: allow
    from_ip: "{{ server_vlan_cidr }}"
    port: "8006"
    proto: tcp
  when: not server_in_container

- name: Café | write the script Windows runs after its install
  ansible.builtin.template:
    src: install.bat.j2
    dest: "{{ pccafe_dir }}/oem/install.bat"
    owner: root
    group: root
    mode: "0644"

- name: Café | write the compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ pccafe_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0600"
  # In a dry run of a fresh server the password does not exist yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Café | run the Windows VM
  community.docker.docker_compose_v2:
    project_src: "{{ pccafe_dir }}"
    state: present
    pull: missing
  when: not server_in_container
  # In a dry run of a fresh server Docker is not installed yet.
  ignore_errors: "{{ ansible_check_mode }}"
